<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TERMINAL SHOOTER 3</title>
<style>
:root {
  --bg: #0a0a0a;
  --fg: #33ff33;
  --accent: #ff3333;
  --muted: #1a1a1a;
  --border: #333;
  --scanline: rgba(0,0,0,0.03);
}
:root.light {
  --bg: #f5f5f0;
  --fg: #1a1a1a;
  --accent: #cc0000;
  --muted: #e8e8e0;
  --border: #ccc;
  --scanline: rgba(0,0,0,0.015);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg);
  display: flex; justify-content: center; align-items: center;
  height: 100vh; overflow: hidden;
  font-family: 'Courier New', monospace;
  transition: background 0.5s;
}
#game-container {
  position: relative;
  border: 2px solid var(--border);
  background: var(--bg);
  box-shadow: 0 0 40px rgba(51,255,51,0.05);
  transition: all 0.5s;
}
:root.light #game-container { box-shadow: 0 0 40px rgba(0,0,0,0.05); }
canvas { display: block; }
#hud {
  position: absolute; top: 10px; left: 0; right: 0;
  display: flex; justify-content: space-between;
  padding: 0 16px; pointer-events: none;
  color: var(--fg); font-size: 13px; letter-spacing: 2px;
  opacity: 0.8; transition: color 0.5s;
}
#hud span { min-width: 80px; }
#theme-toggle {
  position: absolute; bottom: 14px; right: 14px;
  background: none; border: 1px solid var(--border);
  color: var(--fg); cursor: pointer;
  padding: 6px 12px; font-family: inherit; font-size: 11px;
  letter-spacing: 1px; transition: all 0.3s;
  opacity: 0.5;
}
#theme-toggle:hover { opacity: 1; background: var(--muted); }
#overlay {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  justify-content: center; align-items: center;
  color: var(--fg); pointer-events: none; transition: color 0.5s;
}
#overlay .title { font-size: 28px; letter-spacing: 6px; margin-bottom: 16px; text-transform: uppercase; }
#overlay .sub { font-size: 13px; letter-spacing: 3px; opacity: 0.6; margin-bottom: 8px; }
#overlay .blink { animation: blink 1.2s ease-in-out infinite; }
@keyframes blink { 0%,100%{opacity:0.4} 50%{opacity:1} }
</style>
</head>
<body>
<div id="game-container">
  <canvas id="game"></canvas>
  <div id="hud">
    <span id="score">SCORE:0</span>
    <span id="level">WAVE:1</span>
    <span id="lives">♥♥♥</span>
  </div>
  <div id="overlay">
    <div class="title">TERMINAL<br>SHOOTER 3</div>
    <div class="sub blink">PRESS ANY KEY</div>
  </div>
  <button id="theme-toggle" title="Toggle theme">☀/☾</button>
</div>
<script>
// ─── TERMINAL SHOOTER 3 ───────────────────────────────────
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 480, H = 720;
canvas.width = W; canvas.height = H;

const $ = (id) => document.getElementById(id);
const root = document.documentElement;

// ─── AUDIO ENGINE ─────────────────────────────────────────
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let actx = null;
let musicGain = null;
let musicActive = false;
let musicTempo = 120; // BPM
let musicStep = 0;
let musicTimer = 0;
let musicInterval = null;

// Square wave oscillator
function playNote(freq, duration, vol = 0.06) {
  if (!actx) return;
  const osc = actx.createOscillator();
  const gain = actx.createGain();
  osc.type = 'square';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(vol, actx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + duration);
  osc.connect(gain);
  gain.connect(musicGain || actx.destination);
  osc.start();
  osc.stop(actx.currentTime + duration);
}

// Chiptune melody pattern — pentatonic-ish, dark
const melody = [
  [262, 0.12], [330, 0.12], [392, 0.12], [330, 0.12],
  [294, 0.12], [349, 0.12], [440, 0.12], [349, 0.12],
  [262, 0.12], [330, 0.12], [392, 0.12], [523, 0.12],
  [440, 0.12], [392, 0.12], [330, 0.12], [294, 0.12],
  [196, 0.12], [247, 0.12], [294, 0.12], [247, 0.12],
  [220, 0.12], [262, 0.12], [330, 0.12], [262, 0.12],
  [196, 0.12], [247, 0.12], [294, 0.12], [392, 0.12],
  [330, 0.12], [294, 0.12], [262, 0.12], [220, 0.12],
];
const bassLine = [
  [131, 0.24], [131, 0.24], [165, 0.24], [165, 0.24],
  [147, 0.24], [147, 0.24], [175, 0.24], [175, 0.24],
  [131, 0.24], [131, 0.24], [165, 0.24], [165, 0.24],
  [147, 0.24], [147, 0.24], [131, 0.24], [131, 0.24],
];

function startMusic() {
  if (musicActive) return;
  if (!actx) actx = new AudioCtx();
  musicGain = actx.createGain();
  musicGain.gain.value = 0.08;
  musicGain.connect(actx.destination);
  musicActive = true;
  musicStep = 0;
  musicTimer = 0;
  scheduleMusic();
}

function scheduleMusic() {
  if (!musicActive || !actx) return;
  if (musicInterval) clearInterval(musicInterval);
  const beatDuration = 60 / musicTempo;
  musicInterval = setInterval(() => {
    if (!musicActive) { clearInterval(musicInterval); return; }
    const [freq, dur] = melody[musicStep % melody.length];
    playNote(freq, dur * 0.8, 0.05);
    const [bf, bd] = bassLine[musicStep % bassLine.length];
    playNote(bf, bd * 0.8, 0.04);
    // Hi-hat every 2 steps
    if (musicStep % 2 === 0) playNote(8000, 0.02, 0.015);
    musicStep++;
  }, beatDuration * 500);
}

function updateMusicTempo(difficulty) {
  musicTempo = 120 + difficulty * 15;
  if (musicActive) scheduleMusic();
}

function stopMusic() {
  musicActive = false;
  if (musicInterval) clearInterval(musicInterval);
}

// ─── GAME STATE ───────────────────────────────────────────
const STATE = { TITLE: 0, PLAYING: 1, DEAD: 2, RESPAWN: 3 };
let gameState = STATE.TITLE;

let score = 0;
let lives = 3;
let wave = 1;
let difficulty = 0;
let invincible = 0;
let shakeTimer = 0;
let shakeIntensity = 0;

// Player
let player = {
  x: W / 2, y: H - 80,
  w: 24, h: 32,
  speed: 5,
  fireRate: 12, // frames between shots
  fireCooldown: 0,
  powerLevel: 0, // 0-4
  missiles: 0,
  laser: 0,
  shield: 0,
  options: 0,
};

// Arrays
let bullets = [];
let enemyBullets = [];
let enemies = [];
let powerUps = [];
let particles = [];
let stars = [];

// Input
const keys = {};
window.addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if (gameState === STATE.TITLE) startGame();
  if (gameState === STATE.DEAD) respawn();
  if (e.code === 'Space') e.preventDefault();
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });

// ─── STARS ────────────────────────────────────────────────
function initStars() {
  stars = [];
  for (let i = 0; i < 80; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      speed: 0.5 + Math.random() * 2,
      size: Math.random() * 1.5 + 0.5,
      brightness: Math.random() * 0.5 + 0.3,
    });
  }
}

// ─── PARTICLES ────────────────────────────────────────────
function spawnParticles(x, y, count, color) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 4;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 20 + Math.random() * 20,
      maxLife: 40,
      color,
      size: 1 + Math.random() * 2,
    });
  }
}

// ─── POWER-UPS ────────────────────────────────────────────
const POWERUP_TYPES = ['spread', 'rapid', 'laser', 'shield', 'missile', 'option'];
function spawnPowerUp(x, y) {
  if (Math.random() > 0.25) return; // 25% chance
  const type = POWERUP_TYPES[Math.floor(Math.random() * POWERUP_TYPES.length)];
  powerUps.push({ x, y, type, vy: 1.5, w: 16, h: 16, life: 400 });
}

function applyPowerUp(type) {
  switch (type) {
    case 'spread':
      player.powerLevel = Math.min(4, player.powerLevel + 1);
      break;
    case 'rapid':
      player.fireRate = Math.max(4, player.fireRate - 3);
      break;
    case 'laser':
      player.laser = Math.min(3, player.laser + 1);
      break;
    case 'shield':
      player.shield = Math.min(5, player.shield + 1);
      break;
    case 'missile':
      player.missiles = Math.min(4, player.missiles + 1);
      break;
    case 'option':
      player.options = Math.min(2, player.options + 1);
      break;
  }
  spawnParticles(player.x, player.y, 15, '#ffff00');
}

// ─── ENEMIES ──────────────────────────────────────────────
function spawnEnemy() {
  const types = ['basic', 'fast', 'tank', 'shooter'];
  const available = types.slice(0, Math.min(types.length, 1 + Math.floor(difficulty / 3)));
  const type = available[Math.floor(Math.random() * available.length)];

  let enemy = {
    x: 20 + Math.random() * (W - 40),
    y: -30,
    type,
    w: 24, h: 24,
    life: 1,
    shootTimer: 0,
  };

  switch (type) {
    case 'basic':
      enemy.vy = 1.5 + difficulty * 0.1;
      enemy.color = '#ff4444';
      enemy.life = 1;
      enemy.score = 100;
      break;
    case 'fast':
      enemy.vy = 3 + difficulty * 0.15;
      enemy.w = 18; enemy.h = 18;
      enemy.color = '#ffaa00';
      enemy.life = 1;
      enemy.score = 150;
      break;
    case 'tank':
      enemy.vy = 1 + difficulty * 0.05;
      enemy.w = 32; enemy.h = 32;
      enemy.color = '#cc44cc';
      enemy.life = 3 + Math.floor(difficulty / 2);
      enemy.score = 300;
      break;
    case 'shooter':
      enemy.vy = 1.2 + difficulty * 0.08;
      enemy.color = '#44ccff';
      enemy.life = 2;
      enemy.shootTimer = 40 + Math.floor(Math.random() * 60);
      enemy.score = 200;
      break;
  }
  enemies.push(enemy);
}

// ─── SHOOTING ─────────────────────────────────────────────
function playerShoot() {
  if (player.fireCooldown > 0) return;
  player.fireCooldown = player.fireRate;

  const cx = player.x;
  const cy = player.y - player.h / 2;
  const spd = -8;

  // Main shot(s)
  const spread = player.powerLevel;
  bullets.push({ x: cx, y: cy, vx: 0, vy: spd, w: 3, h: 10, color: '#33ff33', damage: 1 });
  if (spread >= 1) {
    bullets.push({ x: cx - 8, y: cy + 6, vx: 0, vy: spd, w: 3, h: 10, color: '#33ff33', damage: 1 });
    bullets.push({ x: cx + 8, y: cy + 6, vx: 0, vy: spd, w: 3, h: 10, color: '#33ff33', damage: 1 });
  }
  if (spread >= 2) {
    bullets.push({ x: cx - 16, y: cy + 10, vx: -0.5, vy: spd, w: 3, h: 10, color: '#66ff66', damage: 1 });
    bullets.push({ x: cx + 16, y: cy + 10, vx: 0.5, vy: spd, w: 3, h: 10, color: '#66ff66', damage: 1 });
  }
  if (spread >= 3) {
    bullets.push({ x: cx - 16, y: cy + 4, vx: -1, vy: spd, w: 3, h: 10, color: '#99ff99', damage: 1 });
    bullets.push({ x: cx + 16, y: cy + 4, vx: 1, vy: spd, w: 3, h: 10, color: '#99ff99', damage: 1 });
  }
  if (spread >= 4) {
    bullets.push({ x: cx - 12, y: cy + 8, vx: -1.5, vy: spd, w: 3, h: 10, color: '#ccffcc', damage: 1 });
    bullets.push({ x: cx + 12, y: cy + 8, vx: 1.5, vy: spd, w: 3, h: 10, color: '#ccffcc', damage: 1 });
  }

  // Laser
  if (player.laser > 0) {
    bullets.push({ x: cx - 10, y: cy, vx: 0, vy: spd, w: 3, h: 20, color: '#ff3333', damage: 2, laser: true });
    bullets.push({ x: cx + 10, y: cy, vx: 0, vy: spd, w: 3, h: 20, color: '#ff3333', damage: 2, laser: true });
  }

  // Missiles
  if (player.missiles > 0) {
    for (let i = 0; i < player.missiles; i++) {
      const mx = cx - 15 + (i * 30) / Math.max(1, player.missiles - 1);
      bullets.push({ x: mx, y: cy + 4, vx: 0, vy: -5, w: 4, h: 8, color: '#ffcc00', damage: 3, missile: true });
    }
  }

  playNote(880, 0.05, 0.03);
}

function enemyShoot(enemy) {
  enemyBullets.push({
    x: enemy.x, y: enemy.y + enemy.h / 2,
    vx: 0, vy: 3 + difficulty * 0.2,
    w: 4, h: 8, color: enemy.color,
  });
}

// ─── COLLISION ────────────────────────────────────────────
function rectsCollide(a, b) {
  return (
    Math.abs(a.x - b.x) < (a.w + b.w) / 2 &&
    Math.abs(a.y - b.y) < (a.h + b.h) / 2
  );
}

// ─── UPDATE ──────────────────────────────────────────────
function update() {
  if (gameState !== STATE.PLAYING && gameState !== STATE.RESPAWN) return;

  // Player movement
  let px = player.x, py = player.y;
  if (keys['ArrowLeft'] || keys['KeyA']) px -= player.speed;
  if (keys['ArrowRight'] || keys['KeyD']) px += player.speed;
  if (keys['ArrowUp'] || keys['KeyW']) py -= player.speed;
  if (keys['ArrowDown'] || keys['KeyS']) py += player.speed;
  player.x = Math.max(player.w / 2, Math.min(W - player.w / 2, px));
  player.y = Math.max(player.h / 2, Math.min(H - player.h / 2, py));

  // Shooting
  if (keys['Space'] && gameState === STATE.PLAYING) playerShoot();
  if (player.fireCooldown > 0) player.fireCooldown--;

  // Invincibility timer
  if (invincible > 0) invincible--;

  // Screen shake
  if (shakeTimer > 0) shakeTimer--;

  // Stars
  for (let s of stars) {
    s.y += s.speed;
    if (s.y > H) { s.y = -2; s.x = Math.random() * W; }
  }

  // Bullets
  for (let b of bullets) {
    b.x += b.vx;
    b.y += b.vy;
  }
  bullets = bullets.filter(b => b.y > -20 && b.y < H + 20 && b.x > -20 && b.x < W + 20);

  // Enemy bullets
  for (let b of enemyBullets) {
    b.x += b.vx;
    b.y += b.vy;
  }
  enemyBullets = enemyBullets.filter(b => b.y < H + 20 && b.y > -20);

  // Enemies
  for (let e of enemies) {
    e.y += e.vy;
    if (e.shootTimer !== undefined) {
      e.shootTimer--;
      if (e.shootTimer <= 0 && e.y > 0 && e.y < H - 100) {
        enemyShoot(e);
        e.shootTimer = 50 + Math.floor(Math.random() * 80) - difficulty * 2;
        if (e.shootTimer < 15) e.shootTimer = 15;
      }
    }
  }
  enemies = enemies.filter(e => e.y < H + 50);

  // Power-ups
  for (let p of powerUps) {
    p.y += p.vy;
    p.life--;
  }
  powerUps = powerUps.filter(p => p.y < H + 20 && p.life > 0);

  // Particles
  for (let p of particles) {
    p.x += p.vx;
    p.y += p.vy;
    p.life--;
  }
  particles = particles.filter(p => p.life > 0);

  // Collision: bullets vs enemies
  for (let i = bullets.length - 1; i >= 0; i--) {
    for (let j = enemies.length - 1; j >= 0; j--) {
      if (rectsCollide(bullets[i], enemies[j])) {
        enemies[j].life -= bullets[i].damage;
        spawnParticles(bullets[i].x, bullets[i].y, 3, enemies[j].color);
        if (!bullets[i].laser) bullets.splice(i, 1);
        if (enemies[j].life <= 0) {
          spawnParticles(enemies[j].x, enemies[j].y, 12, enemies[j].color);
          spawnPowerUp(enemies[j].x, enemies[j].y);
          score += enemies[j].score;
          playNote(440, 0.08, 0.04);
          enemies.splice(j, 1);
        }
        break;
      }
    }
  }

  // Collision: enemy bullets vs player
  if (invincible <= 0 && gameState === STATE.PLAYING) {
    for (let i = enemyBullets.length - 1; i >= 0; i--) {
      if (rectsCollide(enemyBullets[i], player)) {
        enemyBullets.splice(i, 1);
        hitPlayer();
        break;
      }
    }
    // Collision: enemies vs player
    for (let i = enemies.length - 1; i >= 0; i--) {
      if (rectsCollide(enemies[i], player)) {
        spawnParticles(enemies[i].x, enemies[i].y, 15, enemies[i].color);
        enemies.splice(i, 1);
        hitPlayer();
        break;
      }
    }
  }

  // Collision: player vs power-ups
  for (let i = powerUps.length - 1; i >= 0; i--) {
    if (rectsCollide(powerUps[i], player)) {
      applyPowerUp(powerUps[i].type);
      powerUps.splice(i, 1);
    }
  }

  // Spawn enemies
  const spawnRate = Math.max(8, 40 - difficulty * 2);
  if (Math.random() < 1 / spawnRate) spawnEnemy();

  // Wave progression
  const newWave = Math.floor(score / 2000) + 1;
  if (newWave > wave) {
    wave = newWave;
    difficulty = Math.floor(score / 2000);
    updateMusicTempo(difficulty);
    spawnParticles(W / 2, H / 2, 30, '#ffff00');
  }

  // Update HUD
  $('score').textContent = `SCORE:${score}`;
  $('level').textContent = `WAVE:${wave}`;
  $('lives').textContent = '♥'.repeat(lives);
}

function hitPlayer() {
  if (player.shield > 0) {
    player.shield--;
    spawnParticles(player.x, player.y, 8, '#00ffff');
    invincible = 30;
    return;
  }
  lives--;
  spawnParticles(player.x, player.y, 20, '#ff0000');
  shakeTimer = 15;
  shakeIntensity = 6;
  playNote(100, 0.3, 0.08);

  if (lives <= 0) {
    gameState = STATE.DEAD;
    stopMusic();
    $('overlay').innerHTML = `
      <div class="title">GAME OVER</div>
      <div class="sub">SCORE: ${score} &nbsp; WAVE: ${wave}</div>
      <div class="sub blink">PRESS ANY KEY</div>
    `;
    $('overlay').style.display = 'flex';
  } else {
    invincible = 90;
    // Reset position
    player.x = W / 2;
    player.y = H - 80;
    // Lose some power
    player.powerLevel = Math.max(0, player.powerLevel - 1);
    player.fireRate = Math.min(12, player.fireRate + 2);
  }
}

function respawn() {
  // Reset everything
  score = 0;
  lives = 3;
  wave = 1;
  difficulty = 0;
  player.x = W / 2;
  player.y = H - 80;
  player.powerLevel = 0;
  player.fireRate = 12;
  player.fireCooldown = 0;
  player.missiles = 0;
  player.laser = 0;
  player.shield = 0;
  player.options = 0;
  invincible = 60;
  bullets = [];
  enemyBullets = [];
  enemies = [];
  powerUps = [];
  particles = [];
  musicTempo = 120;
  startMusic();
  gameState = STATE.PLAYING;
  $('overlay').style.display = 'none';
  $('score').textContent = 'SCORE:0';
  $('level').textContent = 'WAVE:1';
  $('lives').textContent = '♥♥♥';
}

function startGame() {
  score = 0;
  lives = 3;
  wave = 1;
  difficulty = 0;
  player.x = W / 2;
  player.y = H - 80;
  player.powerLevel = 0;
  player.fireRate = 12;
  player.fireCooldown = 0;
  player.missiles = 0;
  player.laser = 0;
  player.shield = 0;
  player.options = 0;
  invincible = 60;
  bullets = [];
  enemyBullets = [];
  enemies = [];
  powerUps = [];
  particles = [];
  musicTempo = 120;
  startMusic();
  gameState = STATE.PLAYING;
  $('overlay').style.display = 'none';
  $('score').textContent = 'SCORE:0';
  $('level').textContent = 'WAVE:1';
  $('lives').textContent = '♥♥♥';
}

// ─── RENDER ───────────────────────────────────────────────
function draw() {
  ctx.clearRect(0, 0, W, H);

  // Screen shake
  let sx = 0, sy = 0;
  if (shakeTimer > 0) {
    sx = (Math.random() - 0.5) * shakeIntensity * (shakeTimer / 15);
    sy = (Math.random() - 0.5) * shakeIntensity * (shakeTimer / 15);
  }
  ctx.save();
  ctx.translate(sx, sy);

  const style = getComputedStyle(root);
  const bg = style.getPropertyValue('--bg').trim();
  const fg = style.getPropertyValue('--fg').trim();
  const accent = style.getPropertyValue('--accent').trim();
  const isLight = root.classList.contains('light');

  // Background
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // Scanlines
  ctx.fillStyle = isLight ? 'rgba(0,0,0,0.015)' : 'rgba(0,0,0,0.05)';
  for (let y = 0; y < H; y += 3) {
    ctx.fillRect(0, y, W, 1);
  }

  // Stars
  for (let s of stars) {
    ctx.fillStyle = isLight
      ? `rgba(0,0,0,${s.brightness * 0.4})`
      : `rgba(255,255,255,${s.brightness * 0.5})`;
    ctx.fillRect(s.x, s.y, s.size, s.size);
  }

  // Power-ups
  for (let p of powerUps) {
    const alpha = p.life < 60 ? p.life / 60 : 1;
    ctx.globalAlpha = alpha;
    let label = '';
    let col = '#fff';
    switch (p.type) {
      case 'spread': label = 'S'; col = '#33ff33'; break;
      case 'rapid': label = 'R'; col = '#ffaa00'; break;
      case 'laser': label = 'L'; col = '#ff3333'; break;
      case 'shield': label = 'D'; col = '#00ffff'; break;
      case 'missile': label = 'M'; col = '#ffcc00'; break;
      case 'option': label = 'O'; col = '#cc88ff'; break;
    }
    ctx.fillStyle = col;
    ctx.fillRect(p.x - p.w / 2, p.y - p.h / 2, p.w, p.h);
    ctx.fillStyle = '#000';
    ctx.font = 'bold 11px "Courier New"';
    ctx.textAlign = 'center';
    ctx.fillText(label, p.x, p.y + 4);
    ctx.globalAlpha = 1;
  }

  // Bullets
  for (let b of bullets) {
    ctx.fillStyle = b.color;
    if (b.laser) {
      ctx.fillRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h);
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.fillRect(b.x - 1, b.y - b.h / 2, 2, b.h);
    } else if (b.missile) {
      ctx.fillRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h);
      // Trail
      ctx.fillStyle = 'rgba(255,200,0,0.4)';
      ctx.fillRect(b.x - 1, b.y, 2, 6);
    } else {
      ctx.fillRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h);
    }
  }

  // Enemy bullets
  for (let b of enemyBullets) {
    ctx.fillStyle = b.color;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.w / 2, 0, Math.PI * 2);
    ctx.fill();
    // Glow
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.w / 4, 0, Math.PI * 2);
    ctx.fill();
  }

  // Enemies
  for (let e of enemies) {
    ctx.fillStyle = e.color;
    const hw = e.w / 2, hh = e.h / 2;
    // Different shapes
    switch (e.type) {
      case 'basic':
        ctx.beginPath();
        ctx.moveTo(e.x, e.y - hh);
        ctx.lineTo(e.x + hw, e.y + hh);
        ctx.lineTo(e.x - hw, e.y + hh);
        ctx.closePath();
        ctx.fill();
        break;
      case 'fast':
        ctx.fillRect(e.x - hw, e.y - hh, e.w, e.h);
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.fillRect(e.x - hw + 2, e.y - hh + 2, e.w - 4, e.h - 4);
        break;
      case 'tank':
        ctx.beginPath();
        ctx.arc(e.x, e.y, hw, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.beginPath();
        ctx.arc(e.x, e.y, hw * 0.6, 0, Math.PI * 2);
        ctx.fill();
        break;
      case 'shooter':
        ctx.fillRect(e.x - hw, e.y - hh, e.w, e.h);
        // Gun barrel
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.fillRect(e.x - 2, e.y + hh, 4, 6);
        break;
    }
    // Life bar for tanks
    if (e.type === 'tank' && e.life > 1) {
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.fillRect(e.x - hw + 2, e.y - hh - 6, e.w - 4, 3);
      ctx.fillStyle = '#ff0000';
      const lifePct = (e.life - 1) / (2 + Math.floor(difficulty / 2));
      ctx.fillRect(e.x - hw + 2, e.y - hh - 6, (e.w - 4) * lifePct, 3);
    }
  }

  // Player (blinking when invincible)
  if (invincible <= 0 || Math.floor(invincible / 4) % 2 === 0) {
    ctx.fillStyle = fg;
    const hw = player.w / 2, hh = player.h / 2;
    const px = player.x, py = player.y;

    // Ship body
    ctx.beginPath();
    ctx.moveTo(px, py - hh);         // nose
    ctx.lineTo(px + hw, py + hh);    // right wing
    ctx.lineTo(px + hw * 0.3, py + hh * 0.5); // right indent
    ctx.lineTo(px - hw * 0.3, py + hh * 0.5); // left indent
    ctx.lineTo(px - hw, py + hh);     // left wing
    ctx.closePath();
    ctx.fill();

    // Cockpit
    ctx.fillStyle = accent;
    ctx.beginPath();
    ctx.arc(px, py - 2, 4, 0, Math.PI * 2);
    ctx.fill();

    // Engine glow
    ctx.fillStyle = accent;
    ctx.fillRect(px - 5, py + hh - 2, 10, 4);
    ctx.fillStyle = '#ffaa00';
    ctx.fillRect(px - 3, py + hh - 1, 6, 2);

    // Shield visual
    if (player.shield > 0) {
      ctx.strokeStyle = '#00ffff';
      ctx.lineWidth = 2;
      ctx.globalAlpha = 0.5 + Math.sin(Date.now() / 100) * 0.3;
      ctx.beginPath();
      ctx.arc(px, py, hw + 6, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // Options (drones)
    if (player.options > 0) {
      ctx.fillStyle = fg;
      for (let i = 0; i < player.options; i++) {
        const ox = px - 20 + (i * 40) / Math.max(1, player.options - 1);
        ctx.fillRect(ox - 4, py - 12, 8, 8);
        ctx.fillStyle = accent;
        ctx.fillRect(ox - 2, py - 13, 4, 3);
        ctx.fillStyle = fg;
      }
    }
  }

  // Particles
  for (let p of particles) {
    const alpha = p.life / p.maxLife;
    ctx.fillStyle = p.color;
    ctx.globalAlpha = alpha;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;

  ctx.restore();
}

// ─── GAME LOOP ────────────────────────────────────────────
function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

// ─── THEME TOGGLE ─────────────────────────────────────────
const themeBtn = $('theme-toggle');
themeBtn.addEventListener('click', () => {
  root.classList.toggle('light');
  // Save preference
  const isLight = root.classList.contains('light');
  localStorage.setItem('terminal-shooter-theme', isLight ? 'light' : 'dark');
  themeBtn.textContent = isLight ? '☀' : '☾';
});

// Load saved theme
const savedTheme = localStorage.getItem('terminal-shooter-theme');
if (savedTheme === 'light') {
  root.classList.add('light');
  themeBtn.textContent = '☀';
} else {
  themeBtn.textContent = '☾';
}

// ─── INIT ─────────────────────────────────────────────────
initStars();
gameLoop();
</script>
</body>
</html>
